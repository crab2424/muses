<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>muses — stage UI prototype</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: #05060c;
        /* タブレットでの誤操作を防ぐ */
        touch-action: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
        font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
      #gl { z-index: 1; }
      #overlay { z-index: 2; }
      #hud {
        position: fixed; top: 8px; left: 10px; z-index: 3;
        color: #9fb4d8; font-size: 11px; line-height: 1.5;
        font-family: ui-monospace, Menlo, monospace;
        pointer-events: none; text-shadow: 0 0 4px #000;
      }
      #start {
        position: fixed; inset: 0; z-index: 10;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 12px;
        background: radial-gradient(ellipse at 50% 40%, #131c33, #05060c 70%);
        color: #cfe0ff;
      }
      #start h1 { font-size: 22px; font-weight: 500; letter-spacing: .3em; }
      #start p { font-size: 12px; color: #7d8fb3; letter-spacing: .05em; }
      #start button {
        margin-top: 10px; padding: 14px 34px; font-size: 14px; letter-spacing: .2em;
        color: #e8f0ff; background: #2a3a63; border: 1px solid #4b6199; border-radius: 6px;
      }
      .lil-gui { --width: 300px; font-size: 12px; z-index: 20 !important; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="gl"></canvas>
      <canvas id="overlay"></canvas>
      <div id="hud"></div>
    </div>
    <div id="start">
      <h1>M U S E S</h1>
      <p>stage UI prototype</p>
      <button id="startBtn">TAP TO START</button>
      <p style="margin-top:18px">画面右上のパネルで全パラメータをリアルタイム調整できます</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
