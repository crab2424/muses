<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Note Skin Lab</title>
<style>
  :root {
    --bg: #f4f4f1; --panel: #ffffff; --text: #1d1f1c; --muted: #6a6f68; --line: #d9dbd4;
    --accent: #2f6fd6; --chip: #eceee8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151714; --panel: #1f221e; --text: #e8eae4; --muted: #9aa096; --line: #343831;
      --accent: #7fb0ff; --chip: #2a2e28;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151714; --panel: #1f221e; --text: #e8eae4; --muted: #9aa096; --line: #343831;
    --accent: #7fb0ff; --chip: #2a2e28;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 14px; margin: 0 8px 0 0; font-weight: 600; }
  label.ctl { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  select, button { font: inherit; color: var(--text); background: var(--chip); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 8px; min-height: 30px; }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  #stageWrap { position: relative; flex: 1; min-height: 0; }
  canvas#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
  #labels { position: absolute; inset: 0; pointer-events: none; }
  .tileLabel { position: absolute; pointer-events: auto; cursor: pointer; padding: 3px 7px; margin: 6px;
    border-radius: 6px; background: rgba(15,16,20,.72); color: #fff; font-size: 12px; max-width: calc(100% - 12px);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tileLabel.active { background: var(--accent); }
  .tileLabel .badge { display: inline-block; font-size: 10px; padding: 0 5px; margin-right: 6px; border-radius: 4px;
    background: #fff; color: #111; font-weight: 600; }
  .tileErr { position: absolute; color: #fff; background: #a3262a; padding: 8px; margin: 36px 8px; border-radius: 6px;
    font: 11px/1.4 ui-monospace, monospace; white-space: pre-wrap; max-width: calc(100% - 16px); }
  #detail { display: none; border-top: 1px solid var(--line); background: var(--panel); padding: 10px 16px;
    max-height: 32vh; overflow: auto; }
  #detail.show { display: block; }
  #detail h2 { font-size: 14px; margin: 0 0 4px; }
  #detail p { margin: 4px 0; }
  #detail .k { color: var(--muted); display: inline-block; min-width: 7em; }
  .hint { color: var(--muted); font-size: 12px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
} }
</script>
</head>
<body>
<header>
  <h1>ノーツスキン比較</h1>
  <label class="ctl">譜面 <select id="pattern"></select></label>
  <label class="ctl">再生速度 <select id="speed">
    <option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="0.75">0.75×</option>
    <option value="1" selected>1.0×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option>
    <option value="1.75">1.75×</option><option value="2">2.0×</option>
  </select></label>
  <label class="ctl">白線の下限 <select id="edgeMin">
    <option value="0">0px（遠方で消える）</option><option value="0.5" selected>0.5px（既定、ユーザー決定）</option>
    <option value="1">1px</option><option value="1.5">1.5px（旧: 常に一定幅）</option>
  </select></label>
  <label class="ctl">白線の太さ <select id="edgeScale">
    <option value="0.5">×0.5</option><option value="0.75">×0.75</option><option value="1" selected>×1.0</option>
  </select></label>
  <span id="opts"></span>
  <button id="pause">⏸ 一時停止</button>
  <label class="ctl">視点 <select id="view">
    <option value="full">ゲーム画面そのまま</option>
    <option value="ground">地上判定線付近 ×2.5</option>
    <option value="sky">空中判定線付近 ×2.5</option>
  </select></label>
  <button id="back" style="display:none">← 一覧へ戻る</button>
  <span class="hint" id="hint"></span>
  <span class="hint" id="fps"></span>
</header>
<div id="stageWrap">
  <canvas id="c"></canvas>
  <div id="labels"></div>
</div>
<div id="detail"></div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { CFG, COLORS, derive, buildStage, placeNote, nominalDims } from '../note-tap/stage.js';
import { PATTERNS, noteSpan, TAP_KINDS } from './patterns.js';
import { GLSL_PLACE, GLSL_CLIP, makeSharedUniforms, sampleSlide, uAt, EASE } from '../note-long/long.js';
import { SKIN_PATHS } from './skins/registry.js';

const ASPECT = 2388 / 1668; // iPad Pro 11" 横持ち
const SLIDE_COLORS = { ground: '#35e8ff', sky: '#4affa0', riser: '#4affa0' };
// NoteColors.cs と同じ。Diver は Riser の色違い（紫）
const SKIN_COLORS = { ...COLORS, slide: SLIDE_COLORS, diver: '#c86aff' };
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setScissorTest(true);
renderer.autoClear = false;
const envMap = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

const d = derive(CFG, ASPECT);
const bg = new THREE.Color(CFG.bgColor);
const uniforms = makeSharedUniforms(CFG, d); // 全タイル・全マテリアルで共有（uSongTime だけ毎フレーム更新）
// 白線の見え方（全スキン共通、shared/edge.js の museEdge が使う）。ヘッダの「白線」で切替
uniforms.uEdgeMinPx = { value: 0.5 };   // 白線の最小幅(px)。0 なら遠方で細くなって消える
uniforms.uEdgeScale = { value: 1 };   // 白線の太さの全体倍率
const camera = new THREE.PerspectiveCamera(CFG.phiDeg, ASPECT, 0.05, d.zFar * 1.3);
camera.position.set(0, CFG.yCam, 0);
camera.rotation.x = -d.theta;

// ---------- skins ----------
// スキン = Tap/ExTap/Flick（CPU 配置）＋ Slide/Riser/Diver（頂点シェーダ配置）の一式。契約は README.md
const tiles = [];
const optState = {}; // path -> { key: value }
function readOptsFromUrl() {
  // ?o=key:value,key:value（全スキン共通のキーとして解釈）
  const o = new URLSearchParams(location.search).get('o');
  const m = {};
  if (o) for (const kv of o.split(',')) { const [k, v] = kv.split(':'); if (k) m[k] = v; }
  return m;
}
function makeScene() {
  const scene = new THREE.Scene();
  scene.environment = envMap;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x404040, 1.2));
  const sun = new THREE.DirectionalLight(0xffffff, 1.6);
  sun.position.set(-4, 30, 6); sun.target.position.set(0, 0, -20);
  scene.add(sun, sun.target);
  scene.add(buildStage(CFG, d));
  return scene;
}
function createSkin(tile) {
  tile.err = null;
  if (tile.scene) { for (const obj of tile.notes.values()) { tile.scene.remove(obj); releaseObj(tile, obj); } tile.notes.clear(); }
  tile.scene = makeScene();
  try {
    const opts = {};
    for (const o of tile.def.options || []) opts[o.key] = optState[tile.path][o.key] ?? o.default;
    const ctx = {
      THREE, cfg: CFG, d, colors: SKIN_COLORS, envMap, renderer, opts,
      uniforms, glsl: { place: GLSL_PLACE, clip: GLSL_CLIP }, sampleSlide, uAt, EASE,
      dims: (w) => nominalDims(CFG, d, w),
    };
    tile.api = tile.def.create(ctx);
  } catch (e) {
    console.error(tile.path, e);
    tile.api = null;
    tile.err = String(e && e.stack || e);
  }
}
async function loadSkins() {
  const only = new URLSearchParams(location.search).get('v');
  const paths = only ? only.split(',').filter(Boolean) : SKIN_PATHS;
  const urlOpts = readOptsFromUrl();
  for (const path of paths) {
    const tile = { path, def: null, api: null, scene: null, notes: new Map(), err: null };
    try {
      tile.def = (await import('./skins/' + path)).default;
      optState[path] = {};
      for (const o of tile.def.options || []) optState[path][o.key] = urlOpts[o.key] ?? o.default;
      createSkin(tile);
    } catch (e) {
      console.error(path, e);
      tile.err = String(e && e.stack || e);
    }
    tiles.push(tile);
  }
  buildOptionUI();
}
// スキンの options（見た目の切替: パルスあり/なし 等）をヘッダに並べる。変えるとそのスキンを作り直す
function buildOptionUI() {
  const box = document.getElementById('opts');
  box.innerHTML = '';
  tiles.forEach((tile, ti) => {
    for (const o of (tile.def && tile.def.options) || []) {
      const lab = document.createElement('label');
      lab.className = 'ctl';
      lab.textContent = `${ti + 1}:${o.label} `;
      const sel = document.createElement('select');
      for (const [v, l] of o.choices) sel.add(new Option(l, v));
      sel.value = optState[tile.path][o.key];
      sel.onchange = () => { optState[tile.path][o.key] = sel.value; createSkin(tile); layout(); };
      lab.appendChild(sel);
      box.appendChild(lab);
    }
  });
}

// ---------- UI state ----------
const state = { pattern: 'all', speed: 1, paused: false, view: 'full', focus: -1, time: 0, active: 0, dirty: true };
const LITE_THRESHOLD = 10;
const isLite = () => tiles.length >= LITE_THRESHOLD || new URLSearchParams(location.search).has('lite');
const markDirty = () => { state.dirty = true; };
const patSel = document.getElementById('pattern');
for (const [k, p] of Object.entries(PATTERNS)) patSel.add(new Option(p.label, k));
patSel.value = state.pattern;
patSel.onchange = () => { state.pattern = patSel.value; clearNotes(); markDirty(); };
document.getElementById('edgeScale').onchange = (e) => { uniforms.uEdgeScale.value = +e.target.value; markDirty(); };
document.getElementById('edgeMin').onchange = (e) => { uniforms.uEdgeMinPx.value = +e.target.value; markDirty(); };
{ const q = new URLSearchParams(location.search).get('edge'); if (q !== null) { uniforms.uEdgeMinPx.value = +q; document.getElementById('edgeMin').value = q; } }
document.getElementById('speed').onchange = (e) => { state.speed = +e.target.value; };
const pauseBtn = document.getElementById('pause');
const setPaused = (p) => { state.paused = p; pauseBtn.textContent = p ? '▶ 再生' : '⏸ 一時停止'; pauseBtn.classList.toggle('on', p); };
pauseBtn.onclick = () => setPaused(!state.paused);
document.getElementById('view').onchange = (e) => { state.view = e.target.value; markDirty(); };
const backBtn = document.getElementById('back');
backBtn.onclick = () => setFocus(-1);
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); setPaused(!state.paused); }
  else if (e.code === 'ArrowRight') { setPaused(true); state.time += 1 / 60; markDirty(); }
  else if (e.code === 'ArrowLeft') { setPaused(true); state.time -= 1 / 60; markDirty(); }
  else if (e.code === 'Escape') setFocus(-1);
  else if (/^Digit[1-9]$/.test(e.code)) { const i = +e.code.slice(5) - 1; if (i < tiles.length) setFocus(i); }
});

function setFocus(i) {
  state.focus = i;
  backBtn.style.display = i >= 0 ? '' : 'none';
  const det = document.getElementById('detail');
  if (i >= 0 && tiles[i].def) {
    const v = tiles[i].def;
    const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    det.innerHTML = `<h2>${esc(v.name)}</h2>
      <p><span class="k">担当モデル</span>${esc(v.model)}</p>
      <p><span class="k">コンセプト</span>${esc(v.concept)}</p>
      <p><span class="k">Unity移植</span>${esc(v.unityCost)}</p>`;
    det.classList.add('show');
  } else det.classList.remove('show');
  layout();
}

function disposeObj(obj) { obj.traverse((o) => { if (o.geometry && !o.userData.sharedGeometry) o.geometry.dispose(); }); }
function releaseObj(tile, obj) {
  if (obj.userData.isTap) { if (tile.api && tile.api.releaseTap) tile.api.releaseTap(obj); }
  else disposeObj(obj);
}
function clearNotes() {
  for (const t of tiles) {
    if (!t.scene) continue;
    for (const obj of t.notes.values()) { t.scene.remove(obj); releaseObj(t, obj); }
    t.notes.clear();
  }
}

// ---------- layout ----------
let rects = [];
function layout() {
  const wrap = document.getElementById('stageWrap');
  const W = wrap.clientWidth, H = wrap.clientHeight;
  renderer.setSize(W, H, false);
  const idx = state.focus >= 0 ? [state.focus] : tiles.map((_, i) => i);
  const n = idx.length, gap = 6;
  let best = { cols: 1, w: 0 };
  for (let cols = 1; cols <= n; cols++) {
    const rows = Math.ceil(n / cols);
    const w = Math.min((W - gap * (cols + 1)) / cols, ((H - gap * (rows + 1)) / rows) * ASPECT);
    if (w > best.w) best = { cols, w };
  }
  const cols = best.cols, rows = Math.ceil(n / cols), w = best.w, h = w / ASPECT;
  const ox = (W - (cols * w + (cols - 1) * gap)) / 2, oy = (H - (rows * h + (rows - 1) * gap)) / 2;
  rects = idx.map((ti, k) => ({ ti, x: ox + (k % cols) * (w + gap), y: oy + Math.floor(k / cols) * (h + gap), w, h }));
  markDirty();
  document.getElementById('hint').textContent = isLite()
    ? `軽量モード（${tiles.length}案）: 一覧では選択中（青ラベル）のみ動く / タップで選択→もう一度で拡大`
    : 'タイルをタップで拡大 / Space: 停止 / ←→: コマ送り';
  const labels = document.getElementById('labels');
  labels.innerHTML = '';
  for (const r of rects) {
    const t = tiles[r.ti];
    const el = document.createElement('div');
    el.className = 'tileLabel' + (isLite() && state.focus < 0 && r.ti === state.active ? ' active' : '');
    el.style.left = r.x + 'px'; el.style.top = (r.y + r.h - 34) + 'px'; el.style.maxWidth = (r.w - 12) + 'px';
    const name = t.def ? t.def.name : t.path;
    el.innerHTML = `<span class="badge">${r.ti + 1}</span>${t.def ? `[${t.def.model}] ` : ''}${name}`;
    el.onclick = () => onTileTap(r.ti);
    labels.appendChild(el);
    if (t.err) {
      const er = document.createElement('div');
      er.className = 'tileErr'; er.style.left = r.x + 'px'; er.style.top = r.y + 'px';
      er.textContent = t.err.slice(0, 600);
      labels.appendChild(er);
    }
  }
}
canvas.addEventListener('click', (e) => {
  const b = canvas.getBoundingClientRect();
  const x = e.clientX - b.left, y = e.clientY - b.top;
  const r = rects.find((r) => x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h);
  if (r) onTileTap(r.ti);
});
function onTileTap(ti) {
  if (state.focus >= 0) return setFocus(-1);
  if (isLite() && ti !== state.active) { state.active = ti; layout(); return; }
  setFocus(ti);
}
window.addEventListener('resize', layout);

// ---------- notes ----------
// Slide/Riser/Diver は生成時にノーツ空間の頂点を焼き、配置は頂点シェーダ（uSongTime）が毎フレーム行う。
// Tap/ExTap/Flick は Tap ラボと同じ CPU 配置（ルートの position/scale をハーネスが毎フレーム上書き）。
const TAP_ORDER = { tap: 6, flick: 7, extap: 8 };
const tmp = {};
function updateNotes(tile, songTime, dt) {
  const pat = PATTERNS[state.pattern];
  const P = pat.period;
  const lo = songTime - 0.3, hi = songTime + CFG.readAheadSec + 0.2;
  const alive = new Set();
  for (let k = Math.floor((lo - P) / P); k <= Math.floor(hi / P); k++) {
    pat.notes.forEach((n, i) => {
      const [s0, s1] = noteSpan(n);
      const t0 = s0 + k * P, t1 = s1 + k * P;
      if (t1 < lo || t0 > hi) return;
      const key = k + ':' + i;
      if (TAP_KINDS.has(n.kind)) {
        if (t0 <= songTime) return; // 判定線で消える（オートプレイ）
        const note = { t: t0, cell: n.cellF, width: n.width, layer: n.layer };
        placeNote(CFG, d, note, songTime, tmp);
        if (tmp.progress > 1) return;
        if (tmp.depth < (n.layer ? d.skyNear : d.groundNear)) return;
        alive.add(key);
        let obj = tile.notes.get(key);
        if (!obj) {
          obj = tile.api.makeTap({ kind: n.kind, widthCells: n.width, layer: n.layer, ...nominalDims(CFG, d, n.width) });
          obj.userData.isTap = true;
          // 描画順は Unity の NoteDrawOrder（Slide < Tap < Flick < ExTap < Riser）。子の renderOrder は相対順として残す
          const base = TAP_ORDER[n.kind];
          obj.traverse((o) => { o.frustumCulled = false; o.renderOrder = base + (o.renderOrder || 0) * 0.01; });
          tile.scene.add(obj); tile.notes.set(key, obj);
        }
        obj.position.set(tmp.x, tmp.y + d.zJudge * 0.002, tmp.z);
        obj.scale.set(tmp.sx, tmp.sx, tmp.sz);
        if (tile.api.updateTap) tile.api.updateTap(obj, {
          t: songTime, dt, progress: tmp.progress, depth: tmp.depth, layer: n.layer,
          sx: tmp.sx, sz: tmp.sz, timeToHit: t0 - songTime,
        });
        return;
      }
      alive.add(key);
      if (tile.notes.has(key)) return;
      const shift = k * P;
      let obj;
      if (n.kind === 'slide') obj = tile.api.makeSlide({ ...n, points: n.points.map((p) => ({ ...p, t: p.t + shift })) });
      else obj = tile.api.makeRiser({ ...n, t: n.t + shift, dir: Math.sign(n.layerTo - n.layerF) });
      const base = n.kind === 'slide' ? 5 : 9;
      obj.traverse((o) => { o.frustumCulled = false; o.renderOrder = base + (o.renderOrder || 0) * 0.01; });
      tile.scene.add(obj); tile.notes.set(key, obj);
    });
  }
  for (const [key, obj] of tile.notes) {
    if (!alive.has(key)) { tile.scene.remove(obj); releaseObj(tile, obj); tile.notes.delete(key); }
  }
}

// ---------- frame ----------
let last = performance.now();
const fpsEl = document.getElementById('fps');
let fpsFrames = 0, fpsT0 = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (!state.paused) state.time += dt * state.speed;
  uniforms.uSongTime.value = state.time;
  fpsFrames++;
  if (now - fpsT0 >= 500) { fpsEl.textContent = `${Math.round(fpsFrames * 1000 / (now - fpsT0))} fps`; fpsFrames = 0; fpsT0 = now; }
  const H = canvas.clientHeight;
  const lite = isLite() && state.focus < 0;
  const redrawAll = !lite || state.dirty;
  if (redrawAll) {
    renderer.setScissor(0, 0, canvas.clientWidth, H);
    renderer.setViewport(0, 0, canvas.clientWidth, H);
    renderer.setClearColor(getComputedStyle(document.body).backgroundColor);
    renderer.clear();
  }
  state.dirty = false;
  for (const r of rects) {
    const tile = tiles[r.ti];
    if (!redrawAll && r.ti !== state.active) continue;
    renderer.setScissor(r.x, H - r.y - r.h, r.w, r.h);
    renderer.setViewport(r.x, H - r.y - r.h, r.w, r.h);
    renderer.setClearColor(bg);
    renderer.clear();
    if (!tile.api) continue;
    updateNotes(tile, state.time, state.paused ? 0 : dt * state.speed);
    if (tile.api.beforeRender) tile.api.beforeRender({ t: state.time, dt });
    if (state.view === 'full') camera.clearViewOffset();
    else {
      const z = 2.5, fw = 1000, fh = fw / ASPECT;
      const v = state.view === 'ground' ? CFG.vGroundJudge : CFG.vSkyJudge;
      const cy = (1 - v) / 2 * fh;
      camera.setViewOffset(fw, fh, fw / 2 - fw / z / 2, Math.min(fh - fh / z, Math.max(0, cy - fh / z / 2)), fw / z, fh / z);
    }
    renderer.render(tile.scene, camera);
  }
  requestAnimationFrame(frame);
}

await loadSkins();
layout();
requestAnimationFrame(frame);
window.__lab = { tiles, state, d, uniforms };
</script>
</body>
</html>
