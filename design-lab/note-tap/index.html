<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tap Note Lab</title>
<style>
  :root {
    --bg: #f4f4f1; --panel: #ffffff; --text: #1d1f1c; --muted: #6a6f68; --line: #d9dbd4;
    --accent: #2f6fd6; --chip: #eceee8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151714; --panel: #1f221e; --text: #e8eae4; --muted: #9aa096; --line: #343831;
      --accent: #7fb0ff; --chip: #2a2e28;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151714; --panel: #1f221e; --text: #e8eae4; --muted: #9aa096; --line: #343831;
    --accent: #7fb0ff; --chip: #2a2e28;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 14px; margin: 0 8px 0 0; font-weight: 600; }
  label.ctl { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  select, button { font: inherit; color: var(--text); background: var(--chip); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 8px; min-height: 30px; }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  #stageWrap { position: relative; flex: 1; min-height: 0; }
  canvas#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
  #labels { position: absolute; inset: 0; pointer-events: none; }
  .tileLabel { position: absolute; pointer-events: auto; cursor: pointer; padding: 3px 7px; margin: 6px;
    border-radius: 6px; background: rgba(15,16,20,.72); color: #fff; font-size: 12px; max-width: calc(100% - 12px);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tileLabel.active { background: var(--accent); }
  .tileLabel .badge { display: inline-block; font-size: 10px; padding: 0 5px; margin-right: 6px; border-radius: 4px;
    background: #fff; color: #111; font-weight: 600; }
  .tileErr { position: absolute; color: #fff; background: #a3262a; padding: 8px; margin: 36px 8px; border-radius: 6px;
    font: 11px/1.4 ui-monospace, monospace; white-space: pre-wrap; max-width: calc(100% - 16px); }
  #detail { display: none; border-top: 1px solid var(--line); background: var(--panel); padding: 10px 16px;
    max-height: 32vh; overflow: auto; }
  #detail.show { display: block; }
  #detail h2 { font-size: 14px; margin: 0 0 4px; }
  #detail p { margin: 4px 0; }
  #detail .k { color: var(--muted); display: inline-block; min-width: 7em; }
  .hint { color: var(--muted); font-size: 12px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
} }
</script>
</head>
<body>
<header>
  <h1>Tap ノーツ比較</h1>
  <label class="ctl">譜面 <select id="pattern"></select></label>
  <label class="ctl">再生速度 <select id="speed">
    <option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="0.75">0.75×</option>
    <option value="1" selected>1.0×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option>
    <option value="1.75">1.75×</option><option value="2">2.0×</option>
  </select></label>
  <button id="pause">⏸ 一時停止</button>
  <label class="ctl">視点 <select id="view">
    <option value="full">ゲーム画面そのまま</option>
    <option value="ground">地上判定線付近 ×2.5</option>
    <option value="sky">空中判定線付近 ×2.5</option>
  </select></label>
  <button id="passThrough">判定線で消す</button>
  <button id="back" style="display:none">← 一覧へ戻る</button>
  <span class="hint" id="hint">タイルをタップで拡大 / Space: 停止 / ←→: コマ送り</span>
  <span class="hint" id="fps"></span>
</header>
<div id="stageWrap">
  <canvas id="c"></canvas>
  <div id="labels"></div>
</div>
<div id="detail"></div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { CFG, COLORS, derive, buildStage, placeNote, nominalDims } from './stage.js';
import { PATTERNS } from './patterns.js';
import { VARIANT_PATHS } from './variants/registry.js';

const ASPECT = 2388 / 1668; // iPad Pro 11" 横持ち
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setScissorTest(true);
renderer.autoClear = false;

const pmrem = new THREE.PMREMGenerator(renderer);
const envMap = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const d = derive(CFG, ASPECT);
const bg = new THREE.Color(CFG.bgColor);

const camera = new THREE.PerspectiveCamera(CFG.phiDeg, ASPECT, 0.05, d.zFar * 1.3);
camera.position.set(0, CFG.yCam, 0);
camera.rotation.x = -d.theta;

// ---------- variants ----------
const tiles = [];
async function loadVariants() {
  // ?v=a.js,b.js で表示するバリアントを絞る（作業中の確認用）
  const only = new URLSearchParams(location.search).get('v');
  const paths = only ? only.split(',').filter(Boolean) : VARIANT_PATHS;
  for (const path of paths) {
    const tile = { path, def: null, api: null, scene: null, notes: new Map(), err: null };
    try {
      const mod = await import('./variants/' + path);
      tile.def = mod.default;
      tile.scene = new THREE.Scene();
      tile.scene.environment = envMap;
      tile.scene.add(new THREE.HemisphereLight(0xffffff, 0x404040, 1.2));
      const sun = new THREE.DirectionalLight(0xffffff, 1.6);
      sun.position.set(-4, 30, 6); sun.target.position.set(0, 0, -20);
      tile.scene.add(sun, sun.target);
      tile.scene.add(buildStage(CFG, d));
      tile.api = tile.def.create({
        THREE, cfg: CFG, d, colors: COLORS, envMap, renderer,
        dims: (widthCells) => nominalDims(CFG, d, widthCells),
      });
    } catch (e) {
      console.error(path, e);
      tile.err = String(e && e.stack || e);
    }
    tiles.push(tile);
  }
}

// ---------- UI state ----------
const state = { pattern: 'mixed', speed: 1, paused: false, view: 'full', hideAfterHit: true, focus: -1, time: 0,
  active: 0,   // 軽量モードで一覧中に動かすタイル
  dirty: true, // 軽量モードで静止タイルを描き直す必要があるか
};
// 軽量モード: バリアントが10個以上（または ?lite=1）のとき、一覧では選択中の1枚だけを動かし、
// 他のタイルは設定変更時に1回だけ描いた静止画のままにする。
const LITE_THRESHOLD = 10;
const isLite = () => tiles.length >= LITE_THRESHOLD || new URLSearchParams(location.search).has('lite');
const markDirty = () => { state.dirty = true; };
const patSel = document.getElementById('pattern');
for (const [k, p] of Object.entries(PATTERNS)) patSel.add(new Option(p.label, k));
patSel.onchange = () => { state.pattern = patSel.value; clearNotes(); markDirty(); };
document.getElementById('speed').onchange = (e) => { state.speed = +e.target.value; };
const pauseBtn = document.getElementById('pause');
const setPaused = (p) => { state.paused = p; pauseBtn.textContent = p ? '▶ 再生' : '⏸ 一時停止'; pauseBtn.classList.toggle('on', p); };
pauseBtn.onclick = () => setPaused(!state.paused);
document.getElementById('view').onchange = (e) => { state.view = e.target.value; markDirty(); };
const ptBtn = document.getElementById('passThrough');
ptBtn.classList.add('on');
ptBtn.onclick = () => { state.hideAfterHit = !state.hideAfterHit; ptBtn.classList.toggle('on', state.hideAfterHit); markDirty(); };
const backBtn = document.getElementById('back');
backBtn.onclick = () => setFocus(-1);
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); setPaused(!state.paused); }
  else if (e.code === 'ArrowRight') { setPaused(true); state.time += 1 / 60; markDirty(); }
  else if (e.code === 'ArrowLeft') { setPaused(true); state.time -= 1 / 60; markDirty(); }
  else if (e.code === 'Escape') setFocus(-1);
  else if (/^Digit[1-9]$/.test(e.code)) { const i = +e.code.slice(5) - 1; if (i < tiles.length) setFocus(i); }
});

function setFocus(i) {
  state.focus = i;
  backBtn.style.display = i >= 0 ? '' : 'none';
  const det = document.getElementById('detail');
  if (i >= 0 && tiles[i].def) {
    const v = tiles[i].def;
    const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    det.innerHTML = `<h2>${esc(v.name)}</h2>
      <p><span class="k">担当モデル</span>${esc(v.model)}</p>
      <p><span class="k">コンセプト</span>${esc(v.concept)}</p>
      <p><span class="k">Unity移植</span>${esc(v.unityCost)}</p>`;
    det.classList.add('show');
  } else det.classList.remove('show');
  layout();
}

function clearNotes() {
  for (const t of tiles) {
    for (const obj of t.notes.values()) t.scene.remove(obj);
    t.notes.clear();
  }
}

// ---------- layout ----------
let rects = [];
function layout() {
  const wrap = document.getElementById('stageWrap');
  const W = wrap.clientWidth, H = wrap.clientHeight;
  renderer.setSize(W, H, false);
  const idx = state.focus >= 0 ? [state.focus] : tiles.map((_, i) => i);
  const n = idx.length, gap = 6;
  let best = { cols: 1, w: 0 };
  for (let cols = 1; cols <= n; cols++) {
    const rows = Math.ceil(n / cols);
    const w = Math.min((W - gap * (cols + 1)) / cols, ((H - gap * (rows + 1)) / rows) * ASPECT);
    if (w > best.w) best = { cols, w };
  }
  const cols = best.cols, rows = Math.ceil(n / cols), w = best.w, h = w / ASPECT;
  const ox = (W - (cols * w + (cols - 1) * gap)) / 2, oy = (H - (rows * h + (rows - 1) * gap)) / 2;
  rects = idx.map((ti, k) => ({ ti, x: ox + (k % cols) * (w + gap), y: oy + Math.floor(k / cols) * (h + gap), w, h }));
  markDirty();
  document.getElementById('hint').textContent = isLite()
    ? `軽量モード（${tiles.length}案）: 一覧では選択中（青ラベル）のみ動く / タップで選択→もう一度で拡大`
    : 'タイルをタップで拡大 / Space: 停止 / ←→: コマ送り';
  const labels = document.getElementById('labels');
  labels.innerHTML = '';
  for (const r of rects) {
    const t = tiles[r.ti];
    const el = document.createElement('div');
    el.className = 'tileLabel' + (isLite() && state.focus < 0 && r.ti === state.active ? ' active' : '');
    el.style.left = r.x + 'px'; el.style.top = (r.y + r.h - 34) + 'px'; el.style.maxWidth = (r.w - 12) + 'px';
    const name = t.def ? t.def.name : t.path;
    el.innerHTML = `<span class="badge">${r.ti + 1}</span>${t.def ? `[${t.def.model}] ` : ''}${name}`;
    el.onclick = () => onTileTap(r.ti);
    labels.appendChild(el);
    if (t.err) {
      const er = document.createElement('div');
      er.className = 'tileErr'; er.style.left = r.x + 'px'; er.style.top = r.y + 'px';
      er.textContent = t.err.slice(0, 600);
      labels.appendChild(er);
    }
  }
}
canvas.addEventListener('click', (e) => {
  const b = canvas.getBoundingClientRect();
  const x = e.clientX - b.left, y = e.clientY - b.top;
  const r = rects.find((r) => x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h);
  if (r) onTileTap(r.ti);
});
// 通常: タップで拡大/戻る。軽量モードの一覧: 1回目のタップで「動かすタイル」に選び、選択中をもう一度タップで拡大
function onTileTap(ti) {
  if (state.focus >= 0) return setFocus(-1);
  if (isLite() && ti !== state.active) { state.active = ti; layout(); return; }
  setFocus(ti);
}
window.addEventListener('resize', layout);

// ---------- frame ----------
const tmp = {};
function updateNotes(tile, songTime, dt) {
  const pat = PATTERNS[state.pattern];
  const P = pat.period;
  const lo = songTime - 0.5, hi = songTime + CFG.readAheadSec + 0.1;
  const alive = new Set();
  for (let k = Math.floor(lo / P); k <= Math.floor(hi / P); k++) {
    pat.notes.forEach((n, i) => {
      const t = n.t + k * P;
      if (t < lo || t > hi) return;
      if (state.hideAfterHit && t <= songTime) return;
      const note = { ...n, t };
      placeNote(CFG, d, note, songTime, tmp);
      if (tmp.progress > 1.0) return;
      const near = n.layer ? d.skyNear : d.groundNear;
      if (tmp.depth < near) return;
      const key = k + ':' + i;
      alive.add(key);
      let obj = tile.notes.get(key);
      if (!obj) {
        const dims = nominalDims(CFG, d, n.width);
        obj = tile.api.makeNote({ kind: 'tap', widthCells: n.width, layer: n.layer, ...dims });
        tile.scene.add(obj);
        tile.notes.set(key, obj);
      }
      obj.position.set(tmp.x, tmp.y + d.zJudge * 0.002, tmp.z);
      obj.scale.set(tmp.sx, tmp.sx, tmp.sz);
      if (tile.api.update) tile.api.update(obj, {
        t: songTime, dt, progress: tmp.progress, depth: tmp.depth, layer: n.layer,
        sx: tmp.sx, sz: tmp.sz, timeToHit: t - songTime,
      });
    });
  }
  for (const [key, obj] of tile.notes) {
    if (!alive.has(key)) { tile.scene.remove(obj); tile.notes.delete(key); if (tile.api.release) tile.api.release(obj); }
  }
}

let last = performance.now();
const fpsEl = document.getElementById('fps');
let fpsFrames = 0, fpsT0 = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (!state.paused) state.time += dt * state.speed;
  // 実測フレームレート（requestAnimationFrame の呼ばれる頻度 = 画面のリフレッシュレートに同期）
  fpsFrames++;
  if (now - fpsT0 >= 500) { fpsEl.textContent = `${Math.round(fpsFrames * 1000 / (now - fpsT0))} fps`; fpsFrames = 0; fpsT0 = now; }
  const H = canvas.clientHeight;
  const lite = isLite() && state.focus < 0;
  const redrawAll = !lite || state.dirty;
  if (redrawAll) {
    renderer.setScissor(0, 0, canvas.clientWidth, H);
    renderer.setViewport(0, 0, canvas.clientWidth, H);
    renderer.setClearColor(getComputedStyle(document.body).backgroundColor);
    renderer.clear();
  }
  state.dirty = false;
  for (const r of rects) {
    const tile = tiles[r.ti];
    if (!redrawAll && r.ti !== state.active) continue;
    renderer.setScissor(r.x, H - r.y - r.h, r.w, r.h);
    renderer.setViewport(r.x, H - r.y - r.h, r.w, r.h);
    renderer.setClearColor(bg);
    renderer.clear();
    if (!tile.api) continue;
    updateNotes(tile, state.time, state.paused ? 0 : dt * state.speed);
    if (tile.api.beforeRender) tile.api.beforeRender({ t: state.time, dt });
    if (state.view === 'full') camera.clearViewOffset();
    else {
      const z = 2.5, fw = 1000, fh = fw / ASPECT;
      const v = state.view === 'ground' ? CFG.vGroundJudge : CFG.vSkyJudge;
      const cy = (1 - v) / 2 * fh;
      camera.setViewOffset(fw, fh, fw / 2 - fw / z / 2, Math.min(fh - fh / z, Math.max(0, cy - fh / z / 2)), fw / z, fh / z);
    }
    renderer.render(tile.scene, camera);
  }
  requestAnimationFrame(frame);
}

await loadVariants();
layout();
requestAnimationFrame(frame);
window.__lab = { tiles, state, d };
</script>
</body>
</html>
